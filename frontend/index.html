<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Circle · Er. Perumal Manimekalai College of Engineering</title>
    <meta name="description" content="Official event management, participation registry, and credential platform for Er. Perumal Manimekalai College of Engineering." />
    
    <!-- Modern Clean Typography: Inter for UI & Newsreader for collegiate prestige -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    
    <!-- Tailwind CSS CDN with Human-Crafted Collegiate System -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              college: '#143825',
              'college-dark': '#0c2317',
              'college-light': '#1e5236',
              'college-surface': '#f2f6f3',
              ink: '#111827',
              subtle: '#374151',
              muted: '#6b7280',
              canvas: '#f8f9fa',
              surface: '#ffffff',
              border: '#e5e7eb',
              'border-strong': '#d1d5db',
              lime: '#cfe870',
              emerald: {
                DEFAULT: '#15803d',
                50: '#f0fdf4',
                100: '#dcfce7',
                700: '#15803d',
              },
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              serif: ['"Playfair Display"', '"Newsreader"', 'Georgia', 'serif'],
              mono: ['"DM Mono"', 'monospace'],
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.03)',
              'card-hover': '0 6px 12px -2px rgba(0, 0, 0, 0.06), 0 3px 6px -2px rgba(0, 0, 0, 0.04)',
              'modal': '0 20px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.06)',
            },
            borderRadius: {
              'xs': '4px',
              'sm': '6px',
              'DEFAULT': '8px',
              'md': '10px',
              'lg': '12px',
              'xl': '16px',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-canvas text-ink font-sans antialiased min-h-screen flex flex-col selection:bg-college selection:text-white">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
