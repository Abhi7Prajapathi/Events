name: Campus Circle CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Frontend Job: Node.js, dependencies installation & Vite production build
  # ───────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: 🎨 Frontend Validation & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🚀 Build production bundle
        run: npm run build

      - name: 📁 Verify output bundle
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "❌ Production build directory 'dist' or 'dist/index.html' not found!"
            exit 1
          fi
          echo "✅ Production bundle built successfully."

  # ───────────────────────────────────────────────────────────────────────────
  # Backend Job: Python, PostgreSQL Service Container, Compilation & Unit Tests
  # ───────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: ⚙️ Backend Test Suite & Service Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campus_circle_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🔍 Syntax & byte-compilation validation
        run: |
          python -m py_compile backend/app.py backend/brevo_service.py

      - name: 🧪 Run backend unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/campus_circle_test
          BREVO_API_KEY: ci_test_key_placeholder
          BREVO_SENDER_EMAIL: ci-events@campus.edu
          BREVO_SENDER_NAME: Campus Circle
        run: |
          python -m unittest discover backend/tests

  # ───────────────────────────────────────────────────────────────────────────
  # Docker Job: Validate Dockerfile container build
  # ───────────────────────────────────────────────────────────────────────────
  docker-validation:
    name: 🐳 Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-ci]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: campus-circle-backend:ci-test
